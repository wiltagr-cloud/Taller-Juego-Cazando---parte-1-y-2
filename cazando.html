<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego Cazando</title>

    <link rel="stylesheet" href="cazando.css">

    <script src="utilitarios.js"></script>

</head>

<body>

    <h1>🎯 Juego Cazando</h1>

    <p>Autor: Wilson Tapuy</p>

    <div class="panel">

        <span>
            Puntos:
            <span id="puntos">0</span>
        </span>

        <span>
            Tiempo:
            <span id="tiempo">10</span>
        </span>

    </div>

    <canvas id="juego" width="500" height="350"></canvas>

    <div class="controles">

        <button onclick="moverArriba()">⬆</button>

        <br>

        <button onclick="moverIzquierda()">⬅</button>

        <button onclick="moverAbajo()">⬇</button>
        <button onclick="moverDerecha()">➡</button>
        <button onclick="reiniciar()">Reiniciar</button>

    </div>

    <p id="mensaje"></p>

    <script src="cazando.js"></script>

</body>

</html>
