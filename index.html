<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego Cazando</title>

    <link rel="stylesheet" href="cazando.css">

    <script src="utilitarios.js"></script>
</head>

<body>

    <div class="juego-contenedor">

        <!-- TÍTULO -->
        <header class="encabezado">

            <div class="titulo-caja">

                <div class="icono-titulo">
                    🎯
                </div>

                <div class="titulo-texto">

                    <h1>Juego Cazando</h1>

                    <p class="subtitulo">
                        ¡Apunta, caza y consigue la mayor cantidad de puntos!
                    </p>

                </div>

            </div>

            <p class="autor">
                AUTOR: <strong>Wilson Tapuy</strong>
            </p>

        </header>


        <!-- PANEL DE INFORMACIÓN -->
        <div class="panel">

            <div class="dato">

                <span class="dato-icono">
                    🏆
                </span>

                <div class="dato-contenido">

                    <span class="dato-titulo">
                        PUNTOS
                    </span>

                    <strong id="puntos">
                        0
                    </strong>

                </div>

            </div>


            <div class="separador"></div>


            <div class="dato">

                <span class="dato-icono reloj">
                    ⏱️
                </span>

                <div class="dato-contenido">

                    <span class="dato-titulo">
                        TIEMPO
                    </span>

                    <strong id="tiempo">
                        10
                    </strong>

                </div>

            </div>

        </div>


        <!-- ÁREA DEL JUEGO -->
        <main class="zona-juego">

            <div class="marco-juego">

                <div class="esquina esquina-arriba-izq"></div>
                <div class="esquina esquina-arriba-der"></div>
                <div class="esquina esquina-abajo-izq"></div>
                <div class="esquina esquina-abajo-der"></div>

                <canvas
                    id="juego"
                    width="500"
                    height="350">
                </canvas>

            </div>


            <!-- CONTROLES -->
            <div class="controles">

                <div class="fila-control">

                    <button
                        class="boton boton-arriba"
                        onclick="moverArriba()">

                        ⬆

                    </button>

                </div>


                <div class="fila-control">

                    <button
                        class="boton boton-izquierda"
                        onclick="moverIzquierda()">

                        ⬅

                    </button>


                    <button
                        class="boton boton-abajo"
                        onclick="moverAbajo()">

                        ⬇

                    </button>


                    <button
                        class="boton boton-derecha"
                        onclick="moverDerecha()">

                        ➡

                    </button>

                </div>


                <button
                    class="boton-reiniciar"
                    onclick="reiniciar()">

                    <span>↻</span>

                    Reiniciar

                </button>

            </div>


            <!-- MENSAJE -->
            <p id="mensaje"></p>

        </main>

    </div>


    <script src="cazando.js"></script>

</body>

</html>
